name: Windows build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore .\WowReader.Windows.sln
      - name: Build
        run: dotnet build .\WowReader.Windows.sln --configuration Release --no-restore
      - name: Publish portable Windows build
        if: github.event_name == 'push'
        run: dotnet publish .\src\WowReader.Windows\WowReader.Windows.csproj --configuration Release --runtime win-x64 --self-contained true --output .\artifacts\win-x64
      - name: Bundle Microsoft WebView2 Fixed Version Runtime (x64)
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '156.0.4314.58'
          $expectedHash = '857dcfd6f7035508a29645fa2978c3a6a841f220df77cc366d318894e19f4792'
          $uri = 'https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/b7919cc9-680d-4253-bf32-732988e68aa6/Microsoft.WebView2.FixedVersionRuntime.156.0.4314.58.x64.cab'
          $cab = Join-Path $env:RUNNER_TEMP "Microsoft.WebView2.FixedVersionRuntime.$version.x64.cab"
          $runtime = '.\artifacts\win-x64\WebView2FixedRuntime'
          New-Item -ItemType Directory -Force $runtime | Out-Null
          Invoke-WebRequest -Uri $uri -OutFile $cab
          $actualHash = (Get-FileHash -Path $cab -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "Unexpected WebView2 Fixed Version CAB hash: $actualHash" }
          $cabSignature = Get-AuthenticodeSignature -FilePath $cab
          if ($cabSignature.Status -ne 'Valid' -or $cabSignature.SignerCertificate.Subject -notmatch 'Microsoft') { throw "The WebView2 Fixed Version CAB Authenticode signature is not valid Microsoft code: $($cabSignature.Status)." }
          expand.exe -F:* $cab $runtime
          if ($LASTEXITCODE -ne 0) { throw "Could not extract WebView2 Fixed Version runtime (exit code $LASTEXITCODE)." }
          $runtimePayload = Join-Path $runtime "Microsoft.WebView2.FixedVersionRuntime.$version.x64"
          if (Test-Path $runtimePayload) {
            Get-ChildItem -LiteralPath $runtimePayload -Force | Move-Item -Destination $runtime
            Remove-Item -LiteralPath $runtimePayload -Recurse -Force
          }
          $runtimeExecutable = Join-Path $runtime 'msedgewebview2.exe'
          if (-not (Test-Path $runtimeExecutable)) { throw 'The WebView2 Fixed Version runtime is incomplete.' }
          $signature = Get-AuthenticodeSignature -FilePath $runtimeExecutable
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') { throw "The WebView2 runtime Authenticode signature is not valid Microsoft code: $($signature.Status)." }
          $runtimeBytes = (Get-ChildItem $runtime -Recurse -File | Measure-Object -Property Length -Sum).Sum
          $runtimeMegabytes = [math]::Round($runtimeBytes / 1MB, 1)
          Write-Host "Bundled WebView2 Fixed Version Runtime x64 $version ($runtimeMegabytes MB); CAB SHA-256 $actualHash"
          @"
          Microsoft WebView2 Fixed Version Runtime (x64): $version
          Extracted runtime size: $runtimeBytes bytes
          Source CAB SHA-256: $actualHash
          Included for portable/offline use; this runtime does not auto-update and must be refreshed in future app releases.
          Run from a local writable folder; Fixed Version runtime does not run from a network/UNC path.
          Microsoft deployment guidance: https://learn.microsoft.com/en-us/microsoft-edge/webview2/concepts/distribution
          Runtime package: $uri
          "@ | Set-Content -Encoding UTF8 '.\artifacts\win-x64\WEBVIEW2-RUNTIME.txt'
      - name: Include project and third-party notices
        if: github.event_name == 'push'
        run: |
          Copy-Item .\LICENSE .\artifacts\win-x64\LICENSE
          Copy-Item .\THIRD-PARTY-NOTICES.md .\artifacts\win-x64\THIRD-PARTY-NOTICES.md
          Copy-Item .\README.md .\artifacts\win-x64\README.md
          New-Item -ItemType Directory -Force .\artifacts\win-x64\docs | Out-Null
          Copy-Item .\docs\ANDROID-PARITY.md .\artifacts\win-x64\docs\ANDROID-PARITY.md
      - name: Create portable zip
        if: github.event_name == 'push'
        run: Compress-Archive -Path .\artifacts\win-x64\* -DestinationPath .\artifacts\wow-reader-windows-win-x64.zip -Force
      - name: Upload Windows build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: wow-reader-windows-win-x64
          path: .\artifacts\wow-reader-windows-win-x64.zip
          retention-days: 30
